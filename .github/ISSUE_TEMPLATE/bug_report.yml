name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and synthetic inputs
      description: Do not include customer records or personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
